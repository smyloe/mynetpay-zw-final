# MyNetPay ZW - Netlify configuration
# Static site: no build step. Netlify serves the "public" folder as it is.

[build]
  publish = "public"
  # No build command on purpose. Pages are already generated and committed.

# ---------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# ---------------------------------------------------------------
# TEMPORARY: keeps search engines away while the site is on a
# .netlify.app address and you are still testing.
# DELETE this whole block when you connect your real domain.
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------
# Caching. HTML, CSS and JS are re-checked on every visit so your
# updates appear straight away while you are improving the site.
# ---------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Notes:
# - public/404.html is shown automatically for unknown addresses.
# - /about works as well as /about/ (Netlify serves the folder's index.html).
# - When a custom domain is added later, Netlify redirects the .netlify.app address to it.
